# ==============================================================================
# Stremio Media Server Stack — Kernel & TCP BBR Streaming Optimizations
# Installed to: /etc/sysctl.d/99-stremio-turbo.conf
# ==============================================================================

# Enable Fair Queueing + Google BBR congestion control for fast ramp-up and
# bufferless HTTP 206 video range streaming over high-latency / lossy links
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase maximum socket receive/send buffers to 16 MB for HD / 4K streams
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Connection backlog & socket queue tuning for concurrent MTProto + HTTP streams
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# Keep warm congestion window across short pauses during player seeking
net.ipv4.tcp_slow_start_after_idle = 0

# Enable TCP Fast Open (client + server) and MTU blackhole probing
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# Reduce TIME_WAIT pressure and raise file descriptor cap
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
fs.file-max = 2097152

# Prefer RAM over swap to avoid streaming jitter
vm.swappiness = 10
